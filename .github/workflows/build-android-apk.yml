name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: 输出 Flutter 版本
        run: flutter --version

      - name: 拉取 Flutter 依赖
        run: flutter pub get

      - name: 执行静态检查
        run: flutter analyze

      - name: 构建 Android APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
